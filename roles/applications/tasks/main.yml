---
- name: Require a supported application profile
  ansible.builtin.assert:
    that: dotfiles_profile in arch_application_profiles
    fail_msg: >-
      Unknown profile '{{ dotfiles_profile }}'. Choose full, workstation,
      server, or custom.

- name: Start with explicitly selected applications
  ansible.builtin.set_fact:
    dotfiles_resolved_applications: >-
      {{ dotfiles_selected_apps | default([], true) | list }}

- name: Add applications from the selected profile
  ansible.builtin.set_fact:
    dotfiles_resolved_applications: >-
      {{ dotfiles_resolved_applications + arch_application_groups[item] }}
  loop: "{{ arch_application_profiles[dotfiles_profile].groups }}"

- name: Normalize selected applications
  ansible.builtin.set_fact:
    dotfiles_resolved_applications: >-
      {{ dotfiles_resolved_applications | unique | sort }}

- name: Require known application identifiers
  ansible.builtin.assert:
    that: >-
      dotfiles_resolved_applications |
      difference(arch_application_catalog.keys() | list) |
      length == 0
    fail_msg: >-
      Unknown application identifiers:
      {{ dotfiles_resolved_applications |
      difference(arch_application_catalog.keys() | list) | join(', ') }}

- name: Initialize application package lists
  ansible.builtin.set_fact:
    arch_selected_repo_packages: []
    arch_selected_aur_packages: []

- name: Resolve packages for selected applications
  ansible.builtin.set_fact:
    arch_selected_repo_packages: >-
      {{ arch_selected_repo_packages +
      arch_application_catalog[item].repo_packages }}
    arch_selected_aur_packages: >-
      {{ arch_selected_aur_packages +
      arch_application_catalog[item].aur_packages }}
  loop: "{{ dotfiles_resolved_applications }}"

- name: Normalize application package lists
  ansible.builtin.set_fact:
    arch_selected_repo_packages: "{{ arch_selected_repo_packages | unique | sort }}"
    arch_selected_aur_packages: "{{ arch_selected_aur_packages | unique | sort }}"

- name: Detect graphics vendors for Steam
  ansible.builtin.shell:
    cmd: cat /sys/class/drm/card*/device/vendor 2>/dev/null || true
  when:
    - "'steam' in dotfiles_resolved_applications"
    - dotfiles_steam_vulkan_driver == 'auto'
  register: steam_gpu_vendor_ids
  changed_when: false

- name: Resolve the Steam Vulkan driver
  ansible.builtin.set_fact:
    arch_detected_steam_vulkan_driver: >-
      {{
        'lib32-nvidia-utils'
        if '0x10de' in steam_gpu_vendor_ids.stdout_lines
        else 'lib32-vulkan-radeon'
        if '0x1002' in steam_gpu_vendor_ids.stdout_lines
        else 'lib32-vulkan-intel'
        if '0x8086' in steam_gpu_vendor_ids.stdout_lines
        else 'lib32-vulkan-virtio'
        if '0x1af4' in steam_gpu_vendor_ids.stdout_lines
        else ''
      }}
  when:
    - "'steam' in dotfiles_resolved_applications"
    - dotfiles_steam_vulkan_driver == 'auto'

- name: Select the Steam Vulkan driver
  ansible.builtin.set_fact:
    arch_steam_vulkan_driver: >-
      {{
        arch_detected_steam_vulkan_driver
        if dotfiles_steam_vulkan_driver == 'auto'
        else dotfiles_steam_vulkan_driver
      }}
  when: "'steam' in dotfiles_resolved_applications"

- name: Require a supported Steam Vulkan driver
  ansible.builtin.assert:
    that: arch_steam_vulkan_driver | length > 0
    fail_msg: >-
      No supported GPU was detected for Steam. Set
      dotfiles_steam_vulkan_driver to a lib32 Vulkan driver package.
  when: "'steam' in dotfiles_resolved_applications"

- name: Add the Steam Vulkan driver to selected packages
  ansible.builtin.set_fact:
    arch_selected_repo_packages: >-
      {{ (arch_selected_repo_packages + [arch_steam_vulkan_driver]) | unique | sort }}
  when: "'steam' in dotfiles_resolved_applications"

- name: Enable multilib for Steam
  ansible.builtin.replace:
    path: /etc/pacman.conf
    regexp: '(?m)^#\[multilib\]\n#Include = /etc/pacman.d/mirrorlist$'
    replace: "[multilib]\nInclude = /etc/pacman.d/mirrorlist"
  when: "'steam' in dotfiles_resolved_applications"
  register: multilib_config

- name: Synchronize package databases after enabling multilib
  ansible.builtin.command:
    cmd: pacman -Syu --noconfirm
  when: multilib_config.changed | default(false)
  changed_when: true

- name: Install selected Arch repository applications
  ansible.builtin.package:
    name: "{{ arch_selected_repo_packages }}"
    state: present
  when: arch_selected_repo_packages | length > 0

- name: Clear package cache before AUR builds
  ansible.builtin.command:
    cmd: paccache --remove --keep 0
  when: arch_selected_aur_packages | length > 0
  changed_when: true

- name: Install selected AUR applications
  when: arch_selected_aur_packages | length > 0
  block:
    - name: Allow Yay to run Pacman during application installation
      ansible.builtin.copy:
        content: "{{ dotfiles_user }} ALL=(root) NOPASSWD: /usr/bin/pacman\n"
        dest: /etc/sudoers.d/dots-yay
        mode: "0440"
        validate: /usr/bin/visudo -cf %s

    - name: Install each selected AUR application with Yay
      ansible.builtin.shell:
        cmd: >-
          /usr/bin/yay --sync --needed --noconfirm --cleanafter {{ item }}
          > "{{ dotfiles_home }}/.cache/dots/application-{{ item }}.log" 2>&1
      become: true
      become_user: "{{ dotfiles_user }}"
      register: applications_aur_install
      failed_when: false
      changed_when: applications_aur_install.rc == 0
      loop: "{{ arch_selected_aur_packages }}"

    - name: Remove leftover AUR source trees between builds
      ansible.builtin.shell:
        cmd: |
          for d in {{ dotfiles_home }}/.cache/yay/*/; do
            case "$(basename "$d")" in
              yay) continue ;;
            esac
            rm -rf "$d"
          done
      become: true
      become_user: "{{ dotfiles_user }}"
      changed_when: true

    - name: Collect failed AUR application identifiers
      ansible.builtin.set_fact:
        failed_aur_applications: >-
          {{ applications_aur_install.results |
          selectattr('rc', 'ne', 0) |
          map(attribute='item') | list }}

    - name: Read failed AUR application logs
      ansible.builtin.command:
        cmd: "tail -n 60 {{ dotfiles_home }}/.cache/dots/application-{{ item }}.log"
      loop: "{{ failed_aur_applications }}"
      register: applications_aur_failure_logs
      changed_when: false

    - name: Report the AUR application installation failure
      ansible.builtin.fail:
        msg: |-
          AUR application installation failed for:
          {{ failed_aur_applications | join(', ') }}

          {{ applications_aur_failure_logs.results |
          map(attribute='stdout') | join('\n\n') }}
      when: failed_aur_applications | length > 0
  always:
    - name: Remove the temporary Yay sudo rule
      ansible.builtin.file:
        path: /etc/sudoers.d/dots-yay
        state: absent

- name: Collect applications installed as release binaries
  ansible.builtin.set_fact:
    arch_binary_applications: >-
      {{ arch_application_catalog | dict2items
         | selectattr('key', 'in', dotfiles_resolved_applications)
         | selectattr('value.binary', 'defined')
         | map(attribute='key') | list }}

- name: Create the local binary directory
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.local/bin"
    state: directory
  when: arch_binary_applications | length > 0

- name: Install applications distributed as release binaries
  ansible.builtin.get_url:
    url: "{{ arch_application_catalog[item].binary.url }}"
    dest: "{{ dotfiles_home }}/{{ arch_application_catalog[item].binary.dest }}"
    mode: "0755"
    timeout: 300
  until: binary_download is not failed
  retries: 4
  delay: 5
  loop: "{{ arch_binary_applications }}"
  register: binary_download

- name: Set Fish as the user's login shell
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    shell: /usr/bin/fish
  when: "'fish' in dotfiles_resolved_applications"

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
  when: "'docker' in dotfiles_resolved_applications"

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker.service
    state: started
  register: arch_docker_start
  failed_when: false
  when: "'docker' in dotfiles_resolved_applications"

- name: Record services that could not start
  ansible.builtin.set_fact:
    arch_services_needing_reboot: >-
      {{ (arch_services_needing_reboot | default([]))
         + (['docker.service'] if arch_docker_start is failed else []) }}

- name: Add the user to the Docker group
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    groups: docker
    append: true
  when: "'docker' in dotfiles_resolved_applications"

- name: Enable libvirt
  ansible.builtin.systemd_service:
    name: libvirtd.service
    enabled: true
  when: "'virt-manager' in dotfiles_resolved_applications"

- name: Start libvirt
  ansible.builtin.systemd_service:
    name: libvirtd.service
    state: started
  register: arch_libvirt_start
  failed_when: false
  when: "'virt-manager' in dotfiles_resolved_applications"

- name: Record the libvirt start failure
  ansible.builtin.set_fact:
    arch_services_needing_reboot: >-
      {{ (arch_services_needing_reboot | default([]))
         + (['libvirtd.service'] if arch_libvirt_start is failed else []) }}

- name: Add the user to virtualization groups
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    groups:
      - libvirt
      - kvm
    append: true
  when: "'virt-manager' in dotfiles_resolved_applications"
