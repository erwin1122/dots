---
- name: Install AUR build prerequisites
  ansible.builtin.package:
    name:
      - base-devel
      - git
      - go
    state: present

- name: Clone yay PKGBUILD repository
  ansible.builtin.git:
    repo: https://aur.archlinux.org/yay.git
    dest: "{{ dotfiles_home }}/.cache/dots/yay"
    version: master
    update: true
  become: true
  become_user: "{{ dotfiles_user }}"

- name: Build yay when it is not installed
  ansible.builtin.command:
    cmd: makepkg --cleanbuild --force --noconfirm
    chdir: "{{ dotfiles_home }}/.cache/dots/yay"
  become: true
  become_user: "{{ dotfiles_user }}"
  when: "'yay' not in ansible_facts.packages"
  register: yay_build
  changed_when: yay_build.rc == 0

- name: Find the built yay package
  ansible.builtin.find:
    paths: "{{ dotfiles_home }}/.cache/dots/yay"
    patterns: "yay-[0-9]*-x86_64.pkg.tar.zst"
    file_type: file
    use_regex: false
  when: "'yay' not in ansible_facts.packages"
  register: yay_package

- name: Install the built yay package
  ansible.builtin.command:
    cmd: "pacman -U --noconfirm {{ (yay_package.files | map(attribute='path') | sort | last) }}"
  when: "'yay' not in ansible_facts.packages"
  changed_when: true

- name: Refresh installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Verify yay installation
  ansible.builtin.stat:
    path: /usr/bin/yay
  register: yay_executable

- name: Require a working yay executable
  ansible.builtin.assert:
    that: yay_executable.stat.executable | default(false)
    fail_msg: yay was built but /usr/bin/yay was not installed successfully.
