---
- name: Require resolved applications from the applications role
  ansible.builtin.assert:
    that: dotfiles_resolved_applications is defined
    fail_msg: >-
      The configs role depends on dotfiles_resolved_applications, which is set
      by the applications role. Run it before configs.

- name: Locate configuration packages in the repository
  ansible.builtin.find:
    paths: "{{ dotfiles_config_dir }}"
    file_type: directory
    recurse: false
  register: configs_available
  changed_when: false

- name: List available configuration package identifiers
  ansible.builtin.set_fact:
    configs_available_ids: >-
      {{ configs_available.files | map(attribute='path') | map('basename') | list }}

- name: Determine applications with managed configuration
  ansible.builtin.set_fact:
    configs_active_apps: >-
      {{
        (
          configs_available_ids
          | select('in', dotfiles_resolved_applications) | list
          + (['caelestia']
             if (dotfiles_profile_features.caelestia | default(false) | bool
                 and 'caelestia' in configs_available_ids)
             else [])
        ) | unique | sort
      }}

- name: Install GNU Stow
  ansible.builtin.package:
    name: stow
    state: present
  when: configs_active_apps | length > 0 and (configs_install_stow | default(true)) | bool

- name: Inventory top-level entries of active configuration packages
  ansible.builtin.find:
    paths: "{{ dotfiles_config_dir }}/{{ item }}"
    file_type: any
    hidden: true
    recurse: false
  loop: "{{ configs_active_apps }}"
  register: configs_top
  changed_when: false

- name: Inventory entries inside .config and .omp roots
  ansible.builtin.find:
    paths: "{{ item.path }}"
    file_type: any
    hidden: true
    recurse: false
  loop: >-
    {{ configs_top.results
       | selectattr('files', 'defined')
       | map(attribute='files') | flatten
       | selectattr('path', 'search', '/\.(config|omp)$')
       | list }}
  register: configs_nested
  changed_when: false

- name: Build the potential link mappings
  ansible.builtin.set_fact:
    configs_link_mappings: >-
      {%- set mappings = [] -%}
      {%- for result in configs_top.results -%}
        {%- for entry in result.files | default([]) -%}
          {%- set name = entry.path | basename -%}
          {%- if name not in ['.config', '.omp'] -%}
            {{- mappings.append({
                  'src': entry.path,
                  'dest': dotfiles_home ~ '/' ~ name,
                  'isdir': entry.isdir }) -}}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {%- for result in configs_nested.results -%}
        {%- for entry in result.files | default([]) -%}
          {{- mappings.append({
                'src': entry.path,
                'dest': dotfiles_home ~ '/'
                        ~ (result.item.path | basename) ~ '/'
                        ~ (entry.path | basename),
                'isdir': entry.isdir }) -}}
        {%- endfor -%}
      {%- endfor -%}
      {{- mappings -}}

- name: Check the current state of link targets
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  loop: "{{ configs_link_mappings }}"
  register: configs_targets
  changed_when: false

- name: Create the configuration archive directory
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.cache/dots/archived-configs"
    state: directory

- name: Determine archive candidates
  ansible.builtin.set_fact:
    configs_archive_candidates: >-
      {%- set items = [] -%}
      {%- for result in configs_targets.results -%}
        {%- if result.stat.exists and not result.stat.islnk
              and (not result.stat.isdir or not result.item.isdir) -%}
          {{- items.append(result) -}}
        {%- endif -%}
      {%- endfor -%}
      {{- items -}}

- name: Archive unmanaged content that would conflict with Stow
  ansible.builtin.command:
    cmd: >-
      mv {{ item.item.dest | quote }}
      {{ (dotfiles_home ~ '/.cache/dots/archived-configs/'
          ~ (item.item.dest | replace(dotfiles_home ~ '/', '')
             | replace('/', '-'))
          ~ '-' ~ lookup('pipe', 'date +%Y%m%d-%H%M%S')) | quote }}
  loop: "{{ configs_archive_candidates }}"
  changed_when: true

- name: Remove stale absolute symlinks so Stow can create relative ones
  ansible.builtin.file:
    path: "{{ item.item.dest }}"
    state: absent
  loop: >-
    {{ configs_targets.results
       | selectattr('stat.exists')
       | selectattr('stat.islnk')
       | selectattr('stat.lnk_target', 'match', '^/')
       | list }}
  changed_when: true

- name: Create directories that must not be folded by Stow
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/{{ item }}"
    state: directory
  loop: "{{ configs_no_fold_dirs | default(['.omp']) }}"

- name: Deploy configurations with GNU Stow
  ansible.builtin.command:
    cmd: >-
      stow --dir {{ dotfiles_config_dir | quote }}
      --target {{ dotfiles_home | quote }}
      --verbose=1 --restow {{ configs_active_apps | join(' ') }}
  register: configs_stow
  changed_when: >-
    'LINK' in (configs_stow.stdout ~ configs_stow.stderr)
    or 'UNLINK' in (configs_stow.stdout ~ configs_stow.stderr)
