---
- name: Require resolved application identifiers
  ansible.builtin.assert:
    that: dotfiles_resolved_applications is defined
    fail_msg: >-
      Resolve application IDs with the applications role or the configuration-only
      playbook before running the configs role.

- name: Locate configuration packages in the repository
  ansible.builtin.find:
    paths: "{{ dotfiles_config_dir }}"
    file_type: directory
    recurse: false
  register: configs_available
  changed_when: false

- name: List available configuration package identifiers
  ansible.builtin.set_fact:
    configs_available_ids: >-
      {{ configs_available.files | map(attribute='path') | map('basename') | list }}

- name: Determine applications with managed configuration
  ansible.builtin.set_fact:
    configs_active_apps: >-
      {{
        (
          configs_available_ids
          | select('in', dotfiles_resolved_applications) | list
          + (['caelestia']
             if (dotfiles_profile_features.caelestia | default(false) | bool
                 and 'caelestia' in configs_available_ids)
             else [])
        ) | unique | sort
      }}

- name: Inventory all managed files of active applications
  ansible.builtin.find:
    paths: "{{ dotfiles_config_dir }}/{{ item }}"
    file_type: file
    hidden: true
    recurse: true
  loop: "{{ configs_active_apps }}"
  register: configs_files
  changed_when: false

- name: Build the per-file link mappings
  ansible.builtin.set_fact:
    configs_link_mappings: >-
      {%- set mappings = [] -%}
      {%- for result in configs_files.results -%}
        {%- set app_dir = dotfiles_config_dir ~ '/' ~ result.item ~ '/' -%}
        {%- for entry in result.files | default([]) -%}
          {{- mappings.append({
                'src': entry.path,
                'dest': dotfiles_home ~ '/'
                        ~ (entry.path | replace(app_dir, '', 1)) }) -}}
        {%- endfor -%}
      {%- endfor -%}
      {{- mappings -}}

- name: Collect parent directories of managed files
  ansible.builtin.set_fact:
    configs_parent_directories: >-
      {%- set directories = [] -%}
      {%- for mapping in configs_link_mappings -%}
        {%- set parts = (mapping.dest | relpath(dotfiles_home)).split('/') -%}
        {%- for depth in range(1, parts | length) -%}
          {{- directories.append(dotfiles_home ~ '/' ~ (parts[:depth] | join('/'))) -}}
        {%- endfor -%}
      {%- endfor -%}
      {{- directories | unique | sort -}}

- name: Inspect parent directory symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ configs_parent_directories }}"
  register: configs_parent_targets
  changed_when: false

- name: Detach existing directory symlinks before linking dots files
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  become: "{{ ansible_facts['user_id'] != dotfiles_user }}"
  become_user: "{{ dotfiles_user }}"
  loop: "{{ configs_parent_targets.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.islnk | default(false)

- name: Check the current state of link targets
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  loop: "{{ configs_link_mappings }}"
  register: configs_targets
  changed_when: false

- name: Determine archive candidates
  ansible.builtin.set_fact:
    configs_archive_candidates: >-
      {%- set items = [] -%}
      {%- for result in configs_targets.results -%}
        {%- if result.stat.exists and not result.stat.islnk -%}
          {{- items.append(result) -}}
        {%- endif -%}
      {%- endfor -%}
      {{- items -}}

- name: Inspect the archive directory when regular files need backing up
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.cache/dots/archived-configs"
  register: configs_archive_directory
  when: configs_archive_candidates | length > 0

- name: Create a user-owned archive directory when needed
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.cache/dots/archived-configs"
    state: directory
    owner: "{{ dotfiles_user }}"
  become: >-
    {{ ansible_facts['user_id'] != 'root'
       and configs_archive_directory.stat.exists
       and configs_archive_directory.stat.pw_name != dotfiles_user }}
  become_user: root
  when: configs_archive_candidates | length > 0

- name: Archive unmanaged files that would conflict
  ansible.builtin.command:
    cmd: >-
      mv {{ item.item.dest | quote }}
      {{ (dotfiles_home ~ '/.cache/dots/archived-configs/'
          ~ (item.item.dest | replace(dotfiles_home ~ '/', '')
             | replace('/', '-'))
          ~ '-' ~ lookup('pipe', 'date +%Y%m%d-%H%M%S')) | quote }}
  loop: "{{ configs_archive_candidates }}"
  changed_when: true
  become: "{{ ansible_facts['user_id'] != dotfiles_user }}"
  become_user: "{{ dotfiles_user }}"

- name: Create parent directories for configuration links
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
  become: "{{ ansible_facts['user_id'] != dotfiles_user }}"
  become_user: "{{ dotfiles_user }}"
  loop: "{{ configs_link_mappings }}"
  loop_control:
    label: "{{ item.dest | dirname }}"

- name: Link managed configuration files into the home directory
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  become: "{{ ansible_facts['user_id'] != dotfiles_user }}"
  become_user: "{{ dotfiles_user }}"
  loop: "{{ configs_link_mappings }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Register herdr plugins and reload a running server
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      herdr_bin="$(command -v herdr || true)"
      [ -n "$herdr_bin" ] || herdr_bin="{{ dotfiles_home }}/.local/bin/herdr"
      plugins_dir="{{ dotfiles_home }}/.config/herdr/plugins"
      for manifest in "$plugins_dir"/*/herdr-plugin.toml; do
        [ -e "$manifest" ] || continue
        plugin_dir="$(dirname "$manifest")"
        id="$(sed -n 's/^id *= *"\(.*\)"/\1/p' "$manifest" | head -1)"
        [ -n "$id" ] || continue
        if ! grep -q "\"plugin_id\": \"$id\"" "{{ dotfiles_home }}/.config/herdr/plugins.json" 2>/dev/null; then
          "$herdr_bin" plugin link "$plugin_dir"
        fi
      done
      if "$herdr_bin" status server | grep -q '^status: running$'; then
        "$herdr_bin" server reload-config
      fi
  become: "{{ ansible_facts['user_id'] != dotfiles_user }}"
  become_user: "{{ dotfiles_user }}"
  when: "'herdr' in configs_active_apps"
  changed_when: false
