---
- name: Require resolved applications from the applications role
  ansible.builtin.assert:
    that: dotfiles_resolved_applications is defined
    fail_msg: >-
      The configs role depends on dotfiles_resolved_applications, which is set
      by the applications role. Run it before configs.

- name: Locate configuration packages in the repository
  ansible.builtin.find:
    paths: "{{ dotfiles_config_dir }}"
    file_type: directory
    recurse: false
  register: configs_available
  changed_when: false

- name: List available configuration package identifiers
  ansible.builtin.set_fact:
    configs_available_ids: >-
      {{ configs_available.files | map(attribute='path') | map('basename') | list }}

- name: Determine applications with managed configuration
  ansible.builtin.set_fact:
    configs_active_apps: >-
      {{
        (
          configs_available_ids
          | select('in', dotfiles_resolved_applications) | list
          + (['caelestia']
             if (dotfiles_profile_features.caelestia | default(false) | bool
                 and 'caelestia' in configs_available_ids)
             else [])
        ) | unique | sort
      }}

- name: Inventory top-level entries of active configuration packages
  ansible.builtin.find:
    paths: "{{ dotfiles_config_dir }}/{{ item }}"
    file_type: any
    hidden: true
    recurse: false
  loop: "{{ configs_active_apps }}"
  register: configs_top
  changed_when: false

- name: Inventory entries inside .config and .omp roots
  ansible.builtin.find:
    paths: "{{ item.path }}"
    file_type: any
    hidden: true
    recurse: false
  loop: >-
    {{ configs_top.results
       | selectattr('files', 'defined')
       | map(attribute='files') | flatten
       | selectattr('path', 'search', '/\.(config|omp)$')
       | list }}
  register: configs_nested
  changed_when: false

- name: Build the configuration link mappings
  ansible.builtin.set_fact:
    configs_link_mappings: >-
      {%- set mappings = [] -%}
      {%- for result in configs_top.results -%}
        {%- for entry in result.files | default([]) -%}
          {%- set name = entry.path | basename -%}
          {%- if name not in ['.config', '.omp'] -%}
            {{- mappings.append({
                  'src': entry.path,
                  'dest': dotfiles_home ~ '/' ~ name,
                  'isdir': entry.isdir }) -}}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {%- for result in configs_nested.results -%}
        {%- for entry in result.files | default([]) -%}
          {{- mappings.append({
                'src': entry.path,
                'dest': dotfiles_home ~ '/'
                        ~ (result.item.path | basename) ~ '/'
                        ~ (entry.path | basename),
                'isdir': entry.isdir }) -}}
        {%- endfor -%}
      {%- endfor -%}
      {{- mappings -}}

- name: Check the current state of configuration targets
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  loop: "{{ configs_link_mappings }}"
  register: configs_targets
  changed_when: false

- name: Identify existing directories that must be merged, not replaced
  ansible.builtin.set_fact:
    configs_merge_mappings: >-
      {{ configs_targets.results
         | selectattr('stat.exists')
         | selectattr('stat.islnk', 'equalto', false)
         | selectattr('stat.isdir')
         | map(attribute='item')
         | selectattr('isdir')
         | list }}

- name: Inventory entries of directories that will be merged
  ansible.builtin.find:
    paths: "{{ item.src }}"
    file_type: any
    hidden: true
    recurse: false
  loop: "{{ configs_merge_mappings }}"
  register: configs_merge_entries
  changed_when: false

- name: Compute the final link mappings
  ansible.builtin.set_fact:
    configs_final_mappings: >-
      {%- set final = [] -%}
      {%- for mapping in configs_link_mappings -%}
        {%- if mapping in configs_merge_mappings -%}
          {%- for child in configs_merge_entries.results
              | selectattr('item', 'equalto', mapping)
              | map(attribute='files') | flatten -%}
            {{- final.append({
                  'src': child.path,
                  'dest': mapping.dest ~ '/' ~ (child.path | basename) }) -}}
          {%- endfor -%}
        {%- else -%}
          {{- final.append(mapping) -}}
        {%- endif -%}
      {%- endfor -%}
      {{- final -}}

- name: Create the configuration archive directory
  ansible.builtin.file:
    path: "{{ dotfiles_home }}/.cache/dots/archived-configs"
    state: directory

- name: Archive unmanaged files that would be replaced
  ansible.builtin.command:
    cmd: >-
      mv {{ item.item.dest | quote }}
      {{ (dotfiles_home ~ '/.cache/dots/archived-configs/'
          ~ (item.item.dest | replace(dotfiles_home ~ '/', '')
             | replace('/', '-'))
          ~ '-' ~ lookup('pipe', 'date +%Y%m%d-%H%M%S')) | quote }}
  loop: >-
    {{ configs_targets.results
       | selectattr('stat.exists')
       | selectattr('stat.islnk', 'equalto', false)
       | rejectattr('item', 'in', configs_merge_mappings)
       | list }}
  changed_when: true

- name: Create parent directories for configuration links
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
  loop: "{{ configs_final_mappings }}"

- name: Link managed configuration into the home directory
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ configs_final_mappings }}"
