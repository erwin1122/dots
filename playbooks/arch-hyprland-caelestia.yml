---
- name: Build the Arch Hyprland and Caelestia workstation
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/Archlinux.yml

  pre_tasks:
    - name: Verify root provisioning context
      ansible.builtin.command:
        cmd: id -u
      register: provisioning_user_id
      changed_when: false
      tags: always

    - name: Require root provisioning context
      ansible.builtin.assert:
        that: provisioning_user_id.stdout == "0"
        fail_msg: >-
          The bootstrap script must run Ansible as root to install system
          packages.
      tags: always

    - name: Require Arch Linux
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Archlinux"
        fail_msg: >-
          This playbook supports Arch Linux only. Distribution-specific roles
          will be added before enabling another platform.
      tags: always

    - name: Require a supported profile
      ansible.builtin.assert:
        that: dotfiles_profile in arch_application_profiles
        fail_msg: >-
          Unknown profile '{{ dotfiles_profile }}'. Choose full, workstation,
          server, or custom.
      tags: always

    - name: Resolve profile features
      ansible.builtin.set_fact:
        dotfiles_profile_features: "{{ arch_application_profiles[dotfiles_profile] }}"
      tags: always

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto
      tags: always

  roles:
    - role: base
      tags: [base]
    - role: aur
      tags: [aur]
    - role: applications
      tags: [applications]
    - role: desktop
      when: dotfiles_profile_features.desktop | bool
      tags: [desktop]
    - role: caelestia
      when: dotfiles_profile_features.caelestia | bool
      tags: [caelestia]
    - role: configs
      tags: [configs]
